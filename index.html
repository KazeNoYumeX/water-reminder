<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>💧 喝水鬧鐘</title>
<style>
  :root {
    --bg: #f0f7fb;
    --card: #ffffff;
    --primary: #2196f3;
    --primary-dark: #1976d2;
    --danger: #e53935;
    --text: #263238;
    --muted: #607d8b;
    --border: #cfd8dc;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    min-height: 100vh;
  }
  .container { max-width: 540px; margin: 0 auto; }
  h1 { text-align: center; font-size: 28px; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
  }
  h2 { font-size: 18px; margin: 0 0 16px; color: var(--primary-dark); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .field { flex: 1; min-width: 140px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 8px 10px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  button {
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 6px;
    background: var(--primary);
    color: #fff;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover:not(:disabled) { background: var(--primary-dark); }
  button:disabled { background: #b0bec5; cursor: not-allowed; }
  button.danger { background: var(--danger); }
  button.danger:hover:not(:disabled) { background: #c62828; }
  .stats { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .stat-line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
  .stat-line strong { color: var(--primary-dark); font-size: 16px; }
  .status {
    text-align: center;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    margin-top: 12px;
  }
  .status.running { background: #e3f2fd; color: var(--primary-dark); }
  .status.stopped { background: #eceff1; color: var(--muted); }
  .log {
    max-height: 120px;
    overflow-y: auto;
    font-size: 13px;
    color: var(--muted);
    margin-top: 8px;
    padding: 8px;
    background: #fafafa;
    border-radius: 6px;
  }
  .log-item { padding: 2px 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .perm-row {
    display: flex; gap: 8px; align-items: center;
    margin-top: 12px; padding: 10px 12px;
    background: #fafafa; border-radius: 6px; font-size: 13px;
  }
  .perm-row .perm-state { flex: 1; }
  .perm-row button { padding: 6px 12px; font-size: 13px; }
  .perm-state .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px;
    font-weight: 600; font-size: 12px;
  }
  .badge.granted { background: #c8e6c9; color: #2e7d32; }
  .badge.denied  { background: #ffcdd2; color: #c62828; }
  .badge.default { background: #ffe0b2; color: #ef6c00; }

  #toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: var(--primary); color: #fff; padding: 16px 24px;
    border-radius: 12px; font-size: 18px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    display: none; z-index: 9999; cursor: pointer;
    max-width: 90%; text-align: center;
    animation: pop .25s ease-out;
  }
  #toast.show { display: block; }
  #toast small { display: block; font-size: 13px; font-weight: 400; margin-top: 4px; opacity: .9; }
  @keyframes pop {
    from { transform: translate(-50%, -10px); opacity: 0; }
    to   { transform: translate(-50%, 0); opacity: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>💧 喝水鬧鐘</h1>

  <div class="card">
    <h2>每日建議飲水量</h2>
    <div class="row">
      <div class="field">
        <label for="weight">體重 (kg)</label>
        <input type="number" id="weight" min="20" max="200" step="0.1" value="60">
      </div>
      <div class="field">
        <label for="exercise">運動量</label>
        <select id="exercise">
          <option value="0">無 / 久坐</option>
          <option value="350" selected>輕度（30 分鐘以內）</option>
          <option value="600">中度（30–60 分鐘）</option>
          <option value="900">高度（60 分鐘以上）</option>
        </select>
      </div>
    </div>
    <div class="stats">
      <div class="stat-line">
        <span>建議每日飲水量</span>
        <strong><span id="dailyIntake">—</span> ml</strong>
      </div>
      <p class="hint">公式：體重 × 30 ml + 運動補水量</p>
    </div>
  </div>

  <div class="card">
    <h2>提醒設定</h2>
    <div class="row">
      <div class="field">
        <label for="startTime">開始時間</label>
        <input type="time" id="startTime" value="09:00">
      </div>
      <div class="field">
        <label for="endTime">結束時間</label>
        <input type="time" id="endTime" value="21:00">
      </div>
      <div class="field">
        <label for="interval">提醒間隔</label>
        <select id="interval">
          <option value="30">每 30 分鐘</option>
          <option value="60" selected>每 1 小時</option>
          <option value="120">每 2 小時</option>
        </select>
      </div>
    </div>

    <div class="row" style="margin-top: 12px;">
      <div class="field" style="flex: 2;">
        <label for="phrase">提醒語句</label>
        <input type="text" id="phrase" value="該喝水了" maxlength="40" placeholder="例如：該喝水了、補水時間到">
      </div>
      <div class="field">
        <label for="voice">語音</label>
        <select id="voice"></select>
      </div>
    </div>

    <div class="stats">
      <div class="stat-line">
        <span>今日提醒次數</span>
        <strong><span id="totalCount">—</span> 次</strong>
      </div>
      <div class="stat-line">
        <span>每次應喝</span>
        <strong><span id="perDose">—</span> ml</strong>
      </div>
      <div class="stat-line">
        <span>下次提醒</span>
        <strong id="nextTime">—</strong>
      </div>
    </div>

    <div style="margin-top: 16px; display: flex; gap: 8px;">
      <button id="startBtn" style="flex:1;">開始提醒</button>
      <button id="stopBtn" class="danger" disabled style="flex:1;">停止</button>
    </div>

    <div id="status" class="status stopped">尚未啟動</div>

    <div class="perm-row">
      <div class="perm-state">
        通知權限：<span id="permBadge" class="badge default">未授權</span>
      </div>
      <button id="permBtn" type="button">授權通知</button>
      <button id="testBtn" type="button">測試</button>
    </div>
    <p class="hint" id="permHint">提示：macOS 需另外在「系統設定 → 通知」中允許瀏覽器顯示通知，並關閉「專注模式」。</p>

    <div class="log" id="log"></div>
  </div>
</div>

<div id="toast" role="alert"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const weightEl = $('weight');
  const exerciseEl = $('exercise');
  const startTimeEl = $('startTime');
  const endTimeEl = $('endTime');
  const intervalEl = $('interval');
  const dailyIntakeEl = $('dailyIntake');
  const totalCountEl = $('totalCount');
  const perDoseEl = $('perDose');
  const nextTimeEl = $('nextTime');
  const startBtn = $('startBtn');
  const stopBtn = $('stopBtn');
  const statusEl = $('status');
  const logEl = $('log');
  const permBadge = $('permBadge');
  const permBtn = $('permBtn');
  const testBtn = $('testBtn');
  const toastEl = $('toast');
  const phraseEl = $('phrase');
  const voiceEl = $('voice');

  const STORAGE_KEY = 'water-reminder-settings';
  const POLL_INTERVAL_MS = 20000;
  let pollerId = null;
  let scheduleList = [];
  let firedKeys = new Set();

  const keyOf = (d) => d.getTime();

  // ---------- helpers ----------
  const parseTime = (str, ref = new Date()) => {
    const [h, m] = str.split(':').map(Number);
    const d = new Date(ref);
    d.setHours(h, m, 0, 0);
    return d;
  };

  const fmtTime = (d) => d.toTimeString().slice(0, 5);

  const log = (msg) => {
    const item = document.createElement('div');
    item.className = 'log-item';
    item.textContent = `[${fmtTime(new Date())}] ${msg}`;
    logEl.prepend(item);
    while (logEl.children.length > 30) logEl.removeChild(logEl.lastChild);
  };

  // ---------- daily intake ----------
  const calcDailyIntake = () => {
    const w = parseFloat(weightEl.value) || 0;
    const ex = parseInt(exerciseEl.value, 10) || 0;
    return Math.round(w * 30 + ex);
  };

  // ---------- schedule ----------
  const buildSchedule = (anchor = new Date()) => {
    const start = parseTime(startTimeEl.value, anchor);
    const end = parseTime(endTimeEl.value, anchor);
    const interval = parseInt(intervalEl.value, 10);
    if (end <= start) return [];
    const list = [];
    const cur = new Date(start);
    while (cur <= end) {
      list.push(new Date(cur));
      cur.setMinutes(cur.getMinutes() + interval);
    }
    return list;
  };

  const refreshStats = () => {
    const daily = calcDailyIntake();
    dailyIntakeEl.textContent = daily;
    const schedule = buildSchedule();
    totalCountEl.textContent = schedule.length || '—';
    perDoseEl.textContent = schedule.length > 0 ? Math.round(daily / schedule.length) : '—';
  };

  // ---------- notification ----------
  const updatePermBadge = () => {
    if (!('Notification' in window)) {
      permBadge.textContent = '不支援';
      permBadge.className = 'badge denied';
      permBtn.disabled = true;
      return;
    }
    const p = Notification.permission;
    permBadge.className = `badge ${p}`;
    permBadge.textContent = p === 'granted' ? '已授權' : p === 'denied' ? '已封鎖' : '未授權';
    permBtn.disabled = p === 'granted';
    permBtn.textContent = p === 'denied' ? '已被封鎖' : '授權通知';
  };

  const requestPerm = async () => {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      await Notification.requestPermission();
    } else if (Notification.permission === 'denied') {
      alert('通知已被瀏覽器封鎖。\n請點網址列左側的鎖頭圖示 → 通知 → 允許，再重新整理頁面。');
    }
    updatePermBadge();
  };

  const showToast = (title, body) => {
    toastEl.textContent = '';
    toastEl.append(title);
    const small = document.createElement('small');
    small.textContent = body;
    toastEl.append(small);
    toastEl.classList.add('show');
    toastEl.onclick = () => toastEl.classList.remove('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toastEl.classList.remove('show'), 30000);
  };

  // Prefer natural-sounding Chinese voices over the system default robotic ones.
  // Apple's "美佳/Mei-Jia" (zh-TW) and "Sinji/Sin-ji" (zh-HK) sound more natural than "Ting-Ting".
  // Auto-pick order: Google zh-TW (Chrome/Edge) > Apple natural zh-TW/HK > others.
  // Safari has no Google voices, so it falls through to Apple voices.
  const VOICE_PRIORITY = [
    (v) => /^zh[-_]TW$/i.test(v.lang) && /google/i.test(v.name),  // Google 國語（臺灣）
    (v) => /^zh[-_](HK|CN)$/i.test(v.lang) && /google/i.test(v.name),
    (v) => /mei[-_ ]?jia|美佳/i.test(v.name),                       // Apple 美佳 zh-TW
    (v) => /li[-_ ]?mu|黎慕/i.test(v.name),                         // Apple 黎慕 (Siri)
    (v) => /yu[-_ ]?shu|語舒/i.test(v.name),                        // Apple 語舒 (Siri)
    (v) => /sin[-_ ]?ji/i.test(v.name),                            // Apple Sin-ji zh-HK
    (v) => /microsoft.*(hsiaochen|hsiaoyu|yating)/i.test(v.name),  // Microsoft Edge zh-TW
  ];

  const pickVoice = (voices) => {
    for (const test of VOICE_PRIORITY) {
      const m = voices.find(test);
      if (m) return m;
    }
    return voices.find((v) => /zh[-_]TW/i.test(v.lang))
        || voices.find((v) => /^zh/i.test(v.lang))
        || null;
  };

  const populateVoiceList = () => {
    if (!('speechSynthesis' in window)) return;
    const voices = speechSynthesis.getVoices().filter((v) => /^zh/i.test(v.lang));
    if (voices.length === 0) return;
    const saved = voiceEl.value;
    voiceEl.innerHTML = '<option value="">自動挑選</option>'
      + voices.map((v) => `<option value="${v.voiceURI}">${v.name} (${v.lang})</option>`).join('');
    if (saved) voiceEl.value = saved;
  };

  const speak = (text) => {
    try {
      if (!('speechSynthesis' in window)) return false;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-TW';
      u.rate = 0.95;
      u.pitch = 1.0;
      u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const chosen = voiceEl.value
        ? voices.find((v) => v.voiceURI === voiceEl.value)
        : pickVoice(voices);
      if (chosen) u.voice = chosen;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  };

  const beep = () => {
    const phrase = (phraseEl.value || '該喝水囉').trim();
    if (speak(phrase)) return;
    // fallback: short two-tone chime if TTS unavailable
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      [{ t: 0.0, f: 880 }, { t: 0.25, f: 1175 }].forEach(({ t, f }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.connect(gain); gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0.0001, now + t);
        gain.gain.exponentialRampToValueAtTime(0.3, now + t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.4);
        osc.start(now + t);
        osc.stop(now + t + 0.45);
      });
    } catch (e) { /* ignore */ }
  };

  const notify = (title, body) => {
    if ('Notification' in window && Notification.permission === 'granted') {
      try {
        const n = new Notification(title, {
          body,
          icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" font-size="80">💧</text></svg>',
          tag: 'water-reminder',
          requireInteraction: true,
        });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (e) { /* ignore */ }
    }
    showToast(title, body);
    beep();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    document.title = `🔔 ${title}`;
    setTimeout(() => { document.title = '💧 喝水鬧鐘'; }, 30000);
  };

  // ---------- runner ----------
  // Poll-based scheduler: robust against system sleep. setTimeout for long
  // delays is unreliable when the OS sleeps (timer may drift or be skipped),
  // so we periodically scan the schedule and fire anything due that hasn't
  // been fired yet. Missed reminders during sleep fire on the next tick.
  const tick = () => {
    const now = new Date();
    const due = scheduleList.find((t) => t <= now && !firedKeys.has(keyOf(t)));
    if (due) {
      firedKeys.add(keyOf(due));
      const perDose = perDoseEl.textContent;
      notify('💧 該喝水囉！', `這個時段請喝 ${perDose} ml`);
      log(`提醒：${fmtTime(due)} 喝 ${perDose} ml`);
    }
    const upcoming = scheduleList.find((t) => t > now && !firedKeys.has(keyOf(t)));
    if (upcoming) {
      nextTimeEl.textContent = fmtTime(upcoming);
    } else if (firedKeys.size >= scheduleList.length) {
      // All today's reminders fired — roll the schedule forward to the next
      // day so the user doesn't have to restart every morning.
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      const nextDay = buildSchedule(tomorrow);
      if (nextDay.length > 0) {
        scheduleList = nextDay;
        firedKeys = new Set();
        nextTimeEl.textContent = fmtTime(scheduleList[0]);
        log(`今日完成，已自動排定明日 ${scheduleList.length} 次提醒`);
      } else {
        nextTimeEl.textContent = '今日已結束';
        statusEl.className = 'status stopped';
        statusEl.textContent = '今日所有提醒已完成';
        stopBtn.disabled = true;
        startBtn.disabled = false;
        if (pollerId) { clearInterval(pollerId); pollerId = null; }
        log('今日提醒全部完成');
      }
    }
  };

  // Safari requires speechSynthesis to be primed inside a user gesture, or
  // subsequent .speak() calls triggered by timers are silently ignored.
  // Speak an empty utterance at zero volume on Start to unlock the API.
  const primeTTS = () => {
    if (!('speechSynthesis' in window)) return;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  };

  const start = async () => {
    refreshStats();
    scheduleList = buildSchedule();
    if (scheduleList.length === 0) {
      alert('結束時間需晚於開始時間');
      return;
    }
    if ('Notification' in window && Notification.permission === 'default') {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        log('未授權通知，將僅以聲音提醒');
      }
    }
    primeTTS();
    saveSettings();
    firedKeys = new Set();
    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusEl.className = 'status running';
    statusEl.textContent = '運行中…請保持此分頁開啟';
    log(`已啟動，共 ${scheduleList.length} 次提醒`);
    tick();
    if (pollerId) clearInterval(pollerId);
    pollerId = setInterval(tick, POLL_INTERVAL_MS);
  };

  const stop = () => {
    if (pollerId) { clearInterval(pollerId); pollerId = null; }
    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusEl.className = 'status stopped';
    statusEl.textContent = '已停止';
    nextTimeEl.textContent = '—';
    log('已手動停止');
  };

  // ---------- persistence ----------
  const saveSettings = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      weight: weightEl.value,
      exercise: exerciseEl.value,
      startTime: startTimeEl.value,
      endTime: endTimeEl.value,
      interval: intervalEl.value,
      phrase: phraseEl.value,
      voice: voiceEl.value,
    }));
  };

  const loadSettings = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.weight) weightEl.value = s.weight;
      if (s.exercise) exerciseEl.value = s.exercise;
      if (s.startTime) startTimeEl.value = s.startTime;
      if (s.endTime) endTimeEl.value = s.endTime;
      if (s.interval) intervalEl.value = s.interval;
      if (s.phrase) phraseEl.value = s.phrase;
      if (s.voice) voiceEl.dataset.preferred = s.voice;
    } catch (e) { /* ignore */ }
  };

  // ---------- wire up ----------
  [weightEl, exerciseEl, startTimeEl, endTimeEl, intervalEl].forEach((el) => {
    el.addEventListener('change', () => { refreshStats(); saveSettings(); });
    el.addEventListener('input', refreshStats);
  });
  [phraseEl, voiceEl].forEach((el) => el.addEventListener('change', saveSettings));
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
  permBtn.addEventListener('click', requestPerm);
  testBtn.addEventListener('click', () => {
    notify('💧 測試通知', '若你看不到系統通知，請檢查瀏覽器與 macOS 設定');
  });

  loadSettings();
  refreshStats();
  updatePermBadge();

  if ('speechSynthesis' in window) {
    populateVoiceList();
    speechSynthesis.onvoiceschanged = () => {
      populateVoiceList();
      const pref = voiceEl.dataset.preferred;
      if (pref && [...voiceEl.options].some((o) => o.value === pref)) {
        voiceEl.value = pref;
      }
    };
  }
})();
</script>
</body>
</html>
